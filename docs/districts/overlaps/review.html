<!doctype html><html lang="ja"><meta charset="utf-8"><title>郡の重複・判断待ち</title><style>body{font:16px system-ui;background:#152c35;color:#eee7cf;margin:24px}input,select{padding:10px;margin:5px;font:inherit;max-width:95%}svg{width:100%;height:55vh;background:#f0ebdc}button{padding:8px}p{line-height:1.7}</style><h1>通常郡同士の重複・判断待ち</h1><p>郡A：青、郡B：黄、重複：赤。面積は概算です。通常郡同士の領域は判断待ちとして維持しています。</p><input id="q" placeholder="国・郡名で検索"><label><input type="checkbox" id="major" checked>0.01 km²以上</label><select id="list"></select><p id="info"></p><svg id="map" role="img" aria-label="選択した二つの郡と重複範囲"></svg><script>const D={"pairs": [], "shapes": {}};const q=document.querySelector('#q'),list=document.querySelector('#list'),map=document.querySelector('#map'),major=document.querySelector('#major');function path(ps){return ps.map(p=>p.map(r=>'M'+r.map(x=>x.join(',')).join('L')+'Z').join('')).join('')}function show(){const p=D.pairs[+list.value];if(!p){map.innerHTML='';return}const shapes=[D.shapes[p.a],D.shapes[p.b]],pts=shapes.flat(2);let xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);let x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;map.setAttribute('viewBox',[x-10,y-10,w+20,h+20].join(' '));map.innerHTML=shapes.map((s,i)=>'<path d="'+path(s)+'" fill="'+(i?'#dba53555':'#298dcc55')+'" stroke="'+(i?'#9f6b00':'#086d9d')+'" stroke-width="1.5" vector-effect="non-scaling-stroke" fill-rule="evenodd"/>').join('')+'<path d="'+path(p.polygons)+'" fill="#ef3b3b" fill-rule="evenodd"/>';document.querySelector('#info').textContent=p.a_name+' × '+p.b_name+'　約 '+p.area_km2.toFixed(6)+' km²　ゲーム座標 '+p.point.map(x=>x.toFixed(2)).join(', ')}function filter(){list.innerHTML='';D.pairs.forEach((p,i)=>{if((!major.checked||p.area_km2>=.01)&&(p.a_name+p.b_name).includes(q.value)){let o=document.createElement('option');o.value=i;o.textContent=p.a_name+' × '+p.b_name+' ('+p.area_km2.toFixed(4)+' km²)';list.append(o)}});show()}q.oninput=filter;major.onchange=filter;list.onchange=show;filter();</script></html>
